<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clarity Theme Lab</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #24262d; background: #e9ebef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0, #fff 0, transparent 35%), #e9ebef; }
    header, main, footer { max-width: 1180px; margin: auto; }
    header { padding: 30px 24px 0; }
    main { padding: 20px 24px; }
    footer { padding: 0 24px 30px; color: #626976; font-size: 13px; line-height: 1.5; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0; font-size: 22px; }
    h3 { margin: 0 0 10px; font-size: 14px; }
    .lede, .description { color: #626976; line-height: 1.5; }
    .lede { margin: 7px 0 20px; }
    .picker { display: flex; flex-wrap: wrap; gap: 9px; }
    .theme-button { border: 1px solid #cdd1d9; background: #f8f9fb; color: #313640; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-weight: 650; transition: .15s; }
    .theme-button:hover { transform: translateY(-1px); border-color: #8f98a8; }
    .theme-button.active { color: #fff; background: #3068cf; border-color: #3068cf; box-shadow: 0 4px 12px #3068cf35; }
    .theme-button small { opacity: .7; margin-left: 5px; }
    .shell { background: #fff; border: 1px solid #d6d9df; border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px #29304212; }
    .theme-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 800; padding: 5px 8px; border-radius: 99px; background: #edf0f5; color: #555d69; text-transform: uppercase; }
    .badge.active-theme { background: #e3eeff; color: #174eaa; }
    .description { font-size: 14px; margin: 6px 0 16px; }
    .palette-row { display: grid; grid-template-columns: 70px repeat(8, 1fr); }
    .row-name { display: flex; align-items: center; color: #69717d; font: 11px ui-monospace; }
    .swatch { height: 70px; padding: 7px; display: flex; flex-direction: column; justify-content: space-between; font: 10px ui-monospace; }
    .swatch b { font-size: 13px; }
    .swatch:nth-child(2) { border-radius: 7px 0 0 7px; }
    .swatch:last-child { border-radius: 0 7px 7px 0; }
    .previews { display: grid; grid-template-columns: 1fr; gap: 17px; margin-top: 19px; }
    .window { border: 1px solid #0002; border-radius: 10px; overflow: hidden; font: 13px/1.5 "CommitMono Nerd Font", "SFMono-Regular", monospace; box-shadow: 0 6px 18px #00000012; }
    .bar { height: 30px; border-bottom: 1px solid #0002; display: flex; align-items: center; padding: 0 10px; gap: 6px; font: 11px ui-sans-serif; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .35; }
    .bar-title { margin-left: 6px; opacity: .65; }
    .screen { padding: 14px; min-height: 304px; }
    .message, .tool { padding: 8px 10px; margin: 8px 0; border-radius: 5px; }
    .editor { padding: 6px 9px; border: 2px solid; border-radius: 5px; margin-top: 10px; }
    .code { padding: 8px 10px; margin: 8px 0; border-left: 3px solid; }
    .diff { margin-top: 4px; }
    .nvim-grid { display: grid; grid-template-columns: 28px 1fr; }
    .line-number { padding-right: 10px; text-align: right; }
    .status { display: flex; justify-content: space-between; padding: 4px 7px; margin: 10px -14px -14px; }
    .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
    .chip { padding: 5px 4px; border-radius: 4px; text-align: center; font-size: 10px; }
    .metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 16px; }
    .metric { border: 1px solid #dfe2e7; border-radius: 7px; padding: 7px; text-align: center; font: 10px ui-monospace; background: #fafbfc; }
    .metric b { display: block; font-size: 13px; }
    .good { color: #26733a; }
    .ok { color: #8a6200; }
    .bad { color: #b42335; }
    .config { margin-top: 16px; border: 1px solid #dfe2e7; border-radius: 8px; overflow: hidden; }
    .config summary { cursor: pointer; padding: 9px 11px; font-size: 13px; font-weight: 700; background: #f6f7f9; }
    .config pre { margin: 0; padding: 12px; overflow: auto; background: #fafafa; font: 12px/1.5 ui-monospace; }
    .error { padding: 20px; color: #a01828; background: #fff; border: 1px solid #e4adb4; border-radius: 10px; }
    @media (max-width: 850px) {
      header, main, footer { padding-inline: 15px; }
      .previews { grid-template-columns: 1fr; }
      .palette-row { grid-template-columns: 45px repeat(4, 1fr); }
      .row-name { grid-row: span 2; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .theme-head { display: block; }
      .badges { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Clarity Theme Lab</h1>
    <p class="lede">The Clarity family is inspired by Atom One and Tokyo Night. Select a theme to render its real Neovim ANSI combinations.</p>
    <nav class="picker" id="picker" aria-label="Theme selector"></nav>
  </header>
  <main><article class="shell" id="preview"></article></main>
  <footer>Theme definitions are static and curated. Contrast math is used for diagnostics, while committed Neovim snapshots keep these previews reproducible.</footer>

  <script src="themes.generated.js"></script>
  <script>
    (() => {
      const data = window.CLARITY_THEME_DATA;
      const picker = document.querySelector("#picker");
      const preview = document.querySelector("#preview");
      if (!data || !Array.isArray(data.themes)) {
        preview.innerHTML = '<div class="error">Viewer data is missing. Run <code>./themes/generate.py generate</code>.</div>';
        return;
      }

      const profile = (application, appearance) => data.profiles.find(item => item.application === application && item.appearance === appearance);
      const color = (theme, index) => theme.colors[index];
      const group = (nvim, name) => nvim.groups[name];
      const groupStyle = spec => (spec.styles || []).map(style => style === "italic" ? "font-style:italic" : style === "bold" ? "font-weight:700" : "").join(";");
      const groupCss = (theme, spec) => [
        spec.foreground === undefined ? "" : `color:${color(theme, spec.foreground)}`,
        spec.background === undefined ? "" : `background:${color(theme, spec.background)}`,
        groupStyle(spec),
      ].filter(Boolean).join(";");

      function luminance(hex) {
        return [1, 3, 5]
          .map(index => parseInt(hex.slice(index, index + 2), 16) / 255)
          .map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4)
          .reduce((sum, value, index) => sum + value * [.2126, .7152, .0722][index], 0);
      }
      function contrast(first, second) {
        let a = luminance(first), b = luminance(second);
        if (a < b) [a, b] = [b, a];
        return (a + .05) / (b + .05);
      }
      function readableInk(background) {
        return contrast(background, "#ffffff") > contrast(background, "#151820") ? "#ffffff" : "#151820";
      }
      function metric(name, foreground, background) {
        const ratio = contrast(foreground, background);
        const level = ratio >= 4.5 ? "good" : ratio >= 3 ? "ok" : "bad";
        return `<div class="metric"><b class="${level}">${ratio.toFixed(1)}:1</b>${name}</div>`;
      }
      function swatches(theme) {
        return [0, 8].map((start, row) => `
          <div class="palette-row">
            <div class="row-name">${row ? "BRIGHT" : "NORMAL"}</div>
            ${theme.colors.slice(start, start + 8).map((value, index) => `
              <div class="swatch" style="background:${value};color:${readableInk(value)}">
                <b>${start + index}</b><span>${value}</span>
              </div>`).join("")}
          </div>`).join("");
      }
      function nvimPreview(theme, nvim) {
        const visual = group(nvim, "Visual");
        const diffNames = ["DiffAdd", "DiffChange", "DiffDelete"];
        const headings = Array.from({ length: 6 }, (_, index) => group(nvim, `RenderMarkdownH${index + 1}Bg`));
        const pmenu = group(nvim, "Pmenu");
        return `<section>
          <h3>${nvim.label} · :highlight</h3>
          <div class="window" style="background:${theme.ui.background};color:${theme.ui.foreground}">
            <div class="bar" style="${groupCss(theme, pmenu)}"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="bar-title">committed profile snapshot</span></div>
            <div class="screen">
              <div class="nvim-grid">
                <span class="line-number" style="color:${color(theme, 7)}">1</span><span style="${groupCss(theme, group(nvim, "Comment"))}">-- Comment from cterm index 8</span>
                <span class="line-number" style="color:${color(theme, 7)}">2</span><span><i style="${groupCss(theme, group(nvim, "Keyword"))}">local</i> <span style="${groupCss(theme, group(nvim, "Function"))}">render</span> = <span style="${groupCss(theme, group(nvim, "String"))}">"palette"</span></span>
                <span class="line-number" style="color:${color(theme, 7)}">3</span><span><b style="${groupCss(theme, group(nvim, "Statement"))}">return</b> <span style="${groupCss(theme, group(nvim, "Type"))}">Theme</span> { colors = <span style="${groupCss(theme, group(nvim, "Constant"))}">16</span> }</span>
                <span class="line-number" style="color:${color(theme, 7)}">4</span><span style="${groupCss(theme, visual)}">Visual — fg ${visual.foreground} on bg ${visual.background}</span>
              </div>
              <div class="chips">${diffNames.map(name => { const spec = group(nvim, name); return `<span class="chip" style="${groupCss(theme, spec)}">${name} ${spec.foreground}/${spec.background}</span>`; }).join("")}</div>
              <div class="chips">${headings.map((spec, index) => `<span class="chip" style="${groupCss(theme, spec)}">H${index + 1} ${spec.foreground}/${spec.background}</span>`).join("")}</div>
              <div style="${groupCss(theme, pmenu)};padding:7px;margin-top:10px">Pmenu — fg ${pmenu.foreground} on bg ${pmenu.background}</div>
              <div class="status"><b>NORMAL</b><span>${nvim.sourceTheme} · ${theme.appearance}</span></div>
            </div>
          </div>
        </section>`;
      }
      function ghosttyConfig(theme) {
        const lines = [
          `background = ${theme.ui.background}`,
          `cursor-color = ${theme.ui.cursor}`,
          `foreground = ${theme.ui.foreground}`,
          ...theme.colors.map((value, index) => `palette = ${index}=${value}`),
          `selection-background = ${theme.ui.selectionBackground}`,
          `selection-foreground = ${theme.ui.selectionForeground}`,
        ];
        return lines.join("\n");
      }
      function render(id) {
        const theme = data.themes.find(item => item.id === id) || data.themes[0];
        const nvim = profile("neovim", theme.appearance);
        const active = data.selection[theme.appearance] === theme.id;
        location.hash = theme.id;
        document.querySelectorAll(".theme-button").forEach(button => button.classList.toggle("active", button.dataset.id === theme.id));

        const visual = group(nvim, "Visual");
        const diffAdd = group(nvim, "DiffAdd");
        const type = group(nvim, "Type");
        const heading = group(nvim, "RenderMarkdownH1Bg");
        preview.innerHTML = `
          <div class="theme-head">
            <div><h2>${theme.name}</h2><p class="description">${theme.description}</p></div>
            <div class="badges"><span class="badge">${theme.appearance}</span>${active ? '<span class="badge active-theme">active</span>' : ""}</div>
          </div>
          ${swatches(theme)}
          <div class="previews">${nvimPreview(theme, nvim)}</div>
          <div class="metrics">
            ${metric("Visual", color(theme, visual.foreground), color(theme, visual.background))}
            ${metric("DiffAdd", color(theme, diffAdd.foreground), color(theme, diffAdd.background))}
            ${metric("Type/default", color(theme, type.foreground), theme.ui.background)}
            ${metric("Heading", color(theme, heading.foreground), color(theme, heading.background))}
            ${metric("Default", theme.ui.foreground, theme.ui.background)}
          </div>
          <details class="config"><summary>Ghostty theme output</summary><pre>${ghosttyConfig(theme)}</pre></details>`;
      }

      [...data.themes]
        .sort((a, b) => (a.appearance === b.appearance ? a.name.localeCompare(b.name) : a.appearance === "light" ? -1 : 1))
        .forEach(theme => {
          const button = document.createElement("button");
          button.className = "theme-button";
          button.dataset.id = theme.id;
          button.innerHTML = `${theme.name}<small>${theme.appearance === "light" ? "☀" : "●"}</small>`;
          button.addEventListener("click", () => render(theme.id));
          picker.append(button);
        });

      const requested = location.hash.slice(1);
      render(data.themes.some(theme => theme.id === requested) ? requested : data.selection.light);
      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        if (data.themes.some(theme => theme.id === id)) render(id);
      });
    })();
  </script>
</body>
</html>
