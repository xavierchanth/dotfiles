[settings]
paranoid = true
disable_backends = ["asdf", "vfox"]
minimum_release_age = "3d"
lockfile = true
ruby.compile = false

[tools]
rust = { version = "stable", profile = "minimal", components = "cargo,clippy,rustc,rustfmt", targets = "wasm32-unknown-unknown" }
node = "lts"
bun = "latest"
go = "latest"
ruby = "3.3.12"
zig = "latest"
# dart = "latest" # Optional; Flutter currently supplies Dart.

# Rust command-line tools
"cargo:squawk" = "latest"
"cargo:tauri-pilot-cli" = "latest"
"cargo:vtracer" = "latest"
"cargo:wasm-bindgen-cli" = "latest"

# Global command-line tools remain independent of the selected Bun runtime.
"npm:@openai/codex" = "latest"
"npm:codeburn" = "latest"
"npm:convex" = "latest"
"npm:playwright" = "latest"
"npm:t3" = { version = "latest", trust_policy_excludes = ["@pierre/theme@1.1.0"] }

"npm:prettier" = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:astral-sh/ruff" = "latest"
"aqua:pnpm/pnpm" = "latest"
"aqua:mvdan/gofumpt" = "latest"
"aqua:mvdan/sh" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:cue-lang/cue" = "latest"
"aqua:typst/typst" = "latest"
"aqua:Myriad-Dreamin/tinymist" = "latest"
"aqua:tombi-toml/tombi" = "latest"
"aqua:hadolint/hadolint" = "latest"
"aqua:mozilla/sccache" = "latest"
"aqua:aws/aws-cli" = { version = "latest", symlink_bins = true }
